name: attendance_nfc
description: "Cross-platform NFC & Barcode Student Attendance Management App for iOS and Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nfc_manager: ^3.3.0
  mobile_scanner: ^5.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
